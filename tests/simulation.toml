COUNT_TO_VAL = 0
COUNTER_TYPE = 0
COUNT_DIR = 1
# count_limit(1), up(0) — count to 20 then hold
[[simulations.parameters]]
NBITS = 8
STEP = 1
INIT_VAL = 0
COUNT_TO_VAL = 20
