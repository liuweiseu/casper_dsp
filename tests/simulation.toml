# User defined, 8x8 -> 8 (SHIFT=7), Round +/-Inf, Saturate, LATENCY=2
[[simulations.parameters]]
N_BITS_A = 8
BIN_PT_A = 7
N_BITS_B = 8
BIN_PT_B = 7
