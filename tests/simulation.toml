# config.toml
# test simple_addr
[[simulations]]
dir = "Templates"
top = "simple_adder"

# test slice
[[simulations]]
dir = "BasicModules"
top = "slice"
[[simulations.parameters]]
START_BIT = 2
WIDTH = 2

# test delay
[[simulations]]
dir = "BasicModules"
top = "delay"
[[simulations.parameters]]
LATENCY = 1
BITWIDTH = 3

# test bus_create
[[simulations]]
dir = "FlowControl"
top = "bus_create"
[[simulations.parameters]]
NBITS = 8
NINPUTS = 2
[[simulations.parameters]]
NBITS = 10
NINPUTS = 4

# test bus_expand
[[simulations]]
dir = "FlowControl"
top = "bus_expand"
[[simulations.parameters]]
NOUT = 4
WIDTH = 8

# test counter
[[simulations]]
dir = "BasicModules"
top = "counter"
# free_running(0), up(0), step=1 — basic increment with wrap-around
[[simulations.parameters]]
NBITS = 8
STEP = 1
INIT_VAL = 0
COUNT_TO_VAL = 0
COUNTER_TYPE = 0
COUNT_DIR = 0
# free_running(0), up(0), step=3 — non-unit step with wrap-around
[[simulations.parameters]]
NBITS = 8
STEP = 3
INIT_VAL = 0
COUNT_TO_VAL = 0
COUNTER_TYPE = 0
COUNT_DIR = 0
# free_running(0), down(1), step=1 — decrement with wrap-around
[[simulations.parameters]]
NBITS = 8
STEP = 1
INIT_VAL = 255
COUNT_TO_VAL = 0
COUNTER_TYPE = 0
COUNT_DIR = 1
# count_limit(1), up(0) — count to 20 then hold
[[simulations.parameters]]
NBITS = 8
STEP = 1
INIT_VAL = 0
COUNT_TO_VAL = 20
COUNTER_TYPE = 1
COUNT_DIR = 0
# count_limit(1), down(1) — count down to 0 then hold
[[simulations.parameters]]
NBITS = 8
STEP = 1
INIT_VAL = 20
COUNT_TO_VAL = 0
COUNTER_TYPE = 1
COUNT_DIR = 1

# test register
[[simulations]]
dir = "BasicModules"
top = "register"
# USE_RST=1, USE_ENABLE=1 — synchronous reset + enable (default behaviour)
[[simulations.parameters]]
BITWIDTH = 4
USE_RST = 1
USE_ENABLE = 1
# USE_RST=1, USE_ENABLE=0 — synchronous reset only, always latches d when not in reset
[[simulations.parameters]]
BITWIDTH = 4
USE_RST = 1
USE_ENABLE = 0
# USE_RST=0, USE_ENABLE=1 — enable only, no reset
[[simulations.parameters]]
BITWIDTH = 4
USE_RST = 0
USE_ENABLE = 1
# USE_RST=0, USE_ENABLE=0 — direct register, always latches d
[[simulations.parameters]]
BITWIDTH = 4
USE_RST = 0
USE_ENABLE = 0

# test inverter
[[simulations]]
dir = "BasicModules"
top = "inverter"
# LATENCY=0 — combinational output (default)
[[simulations.parameters]]
NBITS = 4
LATENCY = 0
# LATENCY=1 — single pipeline stage
[[simulations.parameters]]
NBITS = 4
LATENCY = 1
# LATENCY=2 — two pipeline stages
[[simulations.parameters]]
NBITS = 4
LATENCY = 2

# test logical
[[simulations]]
dir = "BasicModules"
top = "logical"
# AND, 2-input — basic bitwise AND with pipeline
[[simulations.parameters]]
NBITS = 4
NINPUTS = 2
LATENCY = 1
FUNC = 0
# NAND, 2-input
[[simulations.parameters]]
NBITS = 4
NINPUTS = 2
LATENCY = 1
FUNC = 1
# OR, 2-input
[[simulations.parameters]]
NBITS = 4
NINPUTS = 2
LATENCY = 1
FUNC = 2
# NOR, 2-input
[[simulations.parameters]]
NBITS = 4
NINPUTS = 2
LATENCY = 1
FUNC = 3
# XOR, 2-input
[[simulations.parameters]]
NBITS = 4
NINPUTS = 2
LATENCY = 1
FUNC = 4
# XNOR, 2-input
[[simulations.parameters]]
NBITS = 4
NINPUTS = 2
LATENCY = 1
FUNC = 5
# AND, 3-input — verifies NINPUTS reduction chain
[[simulations.parameters]]
NBITS = 4
NINPUTS = 3
LATENCY = 1
FUNC = 0
# XOR, 2-input, LATENCY=2 — verifies multi-stage pipeline
[[simulations.parameters]]
NBITS = 4
NINPUTS = 2
LATENCY = 2
FUNC = 4

# test bit_reverse
[[simulations]]
dir = "Misc"
top = "bit_reverse"
[[simulations.parameters]]
NBITS = 8
[[simulations.parameters]]
NBITS = 16

# test edge_detect
[[simulations]]
dir = "Misc"
top = "edge_detect"
# rising edge, active high
[[simulations.parameters]]
EDGE_TYPE = 0
OUTPUT_POL = 0
# rising edge, active low
[[simulations.parameters]]
EDGE_TYPE = 0
OUTPUT_POL = 1
# falling edge, active high
[[simulations.parameters]]
EDGE_TYPE = 1
OUTPUT_POL = 0
# falling edge, active low
[[simulations.parameters]]
EDGE_TYPE = 1
OUTPUT_POL = 1
# both edges, active high
[[simulations.parameters]]
EDGE_TYPE = 2
OUTPUT_POL = 0
# both edges, active low
[[simulations.parameters]]
EDGE_TYPE = 2
OUTPUT_POL = 1
