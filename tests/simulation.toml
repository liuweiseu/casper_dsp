COUNT_DIR = 0
# count_limit(1), down(1) — count down to 0 then hold
[[simulations.parameters]]
NBITS = 8
STEP = 1
INIT_VAL = 20
COUNT_TO_VAL = 0
COUNTER_TYPE = 1
COUNT_DIR = 1

