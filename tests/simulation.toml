# simulation.toml
# Entries sorted by directory then by module name.

# ── Vendor IP simulation libraries ───────────────────────────────────────────
# lib_path: path to vendor behavioural models (.v/.sv).
# Relative paths are resolved from the project root.
# Default points to the local platform/ directory so no EDA installation is
# required. Override with an absolute path when Vivado/Quartus is installed.

[xilinx]
lib_path = "platform/xilinx/2021.1/unisims"

[altera]
lib_path = "platform/altera"

# ── BasicModules ─────────────────────────────────────────────────────────────

# test addersubtracter
[[simulations]]
dir = "BasicModules"
top = "addersubtracter"
# MODE=1 subtract, signed 18/17, LATENCY=1 — form used inside cmult (addsub_re)
[[simulations.parameters]]
N_BITS_A = 18
BIN_PT_A = 17
TYPE_A = 1
N_BITS_B = 18
BIN_PT_B = 17
TYPE_B = 1
MODE = 1
USE_CARRY_IN = 0
USE_CARRY_OUT = 0
ASYNC = 0
LATENCY = 1
# MODE=0 add, signed 8/7, LATENCY=2, carry-in + carry-out
[[simulations.parameters]]
N_BITS_A = 8
BIN_PT_A = 7
TYPE_A = 1
N_BITS_B = 8
BIN_PT_B = 7
TYPE_B = 1
MODE = 0
USE_CARRY_IN = 1
USE_CARRY_OUT = 1
ASYNC = 0
LATENCY = 2
# MODE=2 runtime sub, signed 8/7, LATENCY=2, ASYNC=1 — en-gated pipeline
[[simulations.parameters]]
N_BITS_A = 8
BIN_PT_A = 7
TYPE_A = 1
N_BITS_B = 8
BIN_PT_B = 7
TYPE_B = 1
MODE = 2
USE_CARRY_IN = 0
USE_CARRY_OUT = 0
ASYNC = 1
LATENCY = 2

# test constant
[[simulations]]
dir = "BasicModules"
top = "constant"
# zero output
[[simulations.parameters]]
NBITS = 8
VAL = 0
# alternating bits (0xAA)
[[simulations.parameters]]
NBITS = 8
VAL = 170
# maximum 8-bit value
[[simulations.parameters]]
NBITS = 8
VAL = 255
# 4-bit output
[[simulations.parameters]]
NBITS = 4
VAL = 7
# maximum 12-bit value
[[simulations.parameters]]
NBITS = 12
VAL = 4095

# test convert
[[simulations]]
dir = "BasicModules"
top = "convert"
# 18/17 -> 8/7 (SHIFT=10), Truncate + Wrap, LATENCY=1
[[simulations.parameters]]
N_BITS_IN = 18
BIN_PT_IN = 17
TYPE_IN = 1
N_BITS_OUT = 8
BIN_PT_OUT = 7
TYPE_OUT = 1
QUANTIZATION = 0
OVERFLOW = 0
ASYNC = 0
LATENCY = 1
# 18/17 -> 8/7 (SHIFT=10), Round +/-Inf + Saturate, LATENCY=1 — cmult convert form
[[simulations.parameters]]
N_BITS_IN = 18
BIN_PT_IN = 17
TYPE_IN = 1
N_BITS_OUT = 8
BIN_PT_OUT = 7
TYPE_OUT = 1
QUANTIZATION = 1
OVERFLOW = 1
ASYNC = 0
LATENCY = 1
# 12/8 -> 8/4 (SHIFT=4), Round even + Saturate, LATENCY=2, ASYNC=1 — en-gated
[[simulations.parameters]]
N_BITS_IN = 12
BIN_PT_IN = 8
TYPE_IN = 1
N_BITS_OUT = 8
BIN_PT_OUT = 4
TYPE_OUT = 1
QUANTIZATION = 2
OVERFLOW = 1
ASYNC = 1
LATENCY = 2
# 16/8 -> 16/12 (SHIFT=-4, left shift), Saturate, LATENCY=1
[[simulations.parameters]]
N_BITS_IN = 16
BIN_PT_IN = 8
TYPE_IN = 1
N_BITS_OUT = 16
BIN_PT_OUT = 12
TYPE_OUT = 1
QUANTIZATION = 0
OVERFLOW = 1
ASYNC = 0
LATENCY = 1

# test counter
[[simulations]]
