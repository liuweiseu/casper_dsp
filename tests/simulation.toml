BIN_PT_A = 7
N_BITS_B = 8
BIN_PT_B = 7
TYPE_A = 1
TYPE_B = 1
PRECISION = 0
ASYNC = 1
LATENCY = 2

# test register
[[simulations]]
dir = "BasicModules"
top = "register"
# USE_RST=1, USE_ENABLE=1, INIT_VAL=0 — reset + enable, reset to 0
[[simulations.parameters]]
BITWIDTH = 4
USE_RST = 1
USE_ENABLE = 1
# USE_RST=1, USE_ENABLE=0, INIT_VAL=0 — reset only, always latches d when not in reset
[[simulations.parameters]]
BITWIDTH = 4
USE_RST = 1
USE_ENABLE = 0
# USE_RST=0, USE_ENABLE=1 — enable only, no reset
[[simulations.parameters]]
BITWIDTH = 4
USE_RST = 0
USE_ENABLE = 1
# USE_RST=0, USE_ENABLE=0 — direct register, always latches d
[[simulations.parameters]]
BITWIDTH = 4
USE_RST = 0
USE_ENABLE = 0
# USE_RST=1, USE_ENABLE=1, INIT_VAL=7 — reset + enable, reset loads 7
[[simulations.parameters]]
BITWIDTH = 4
USE_RST = 1
USE_ENABLE = 1
INIT_VAL = 7
# USE_RST=1, USE_ENABLE=0, INIT_VAL=10 — reset only, reset loads 10
[[simulations.parameters]]
BITWIDTH = 4
USE_RST = 1
USE_ENABLE = 0
INIT_VAL = 10

