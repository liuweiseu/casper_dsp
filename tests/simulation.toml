# simulation.toml
# Entries sorted by directory then by module name.

# ── Vendor IP simulation libraries ───────────────────────────────────────────
# lib_path: path to vendor behavioural models (.v/.sv).
# Relative paths are resolved from the project root.
# Default points to the local platform/ directory so no EDA installation is
# required. Override with an absolute path when Vivado/Quartus is installed.

[xilinx]
lib_path = "platform/xilinx/2021.1/unisims"

[altera]
lib_path = "platform/altera"

# ── Test data ────────────────────────────────────────────────────────────────
# Where each module's test data comes from.
#
# generate = false : run the tests on test_data/ as it is (committed,
#                    imported or MATLAB-exported data).
# generate = true  : before a module's tests run, regenerate that module's
#                    data with test_data/scripts/<test_data_script> --module
#                    <top>. Only entries with a test_data_script are
#                    regenerated; generation writes into the test
#                    container's copy of test_data/, so the repository's
#                    test_data/ is never modified.
#
# Per module, a [[simulations]] entry may override the global switch with
#   generate_test_data = true / false
# e.g. keep generate = true but set generate_test_data = false on a module
# whose test data you imported yourself.

[test_data]
generate = false

# ── Simulation length ────────────────────────────────────────────────────────
# Every [[simulations]] entry has a simulation_cycles key: the number of clock
# cycles each test runs, from the Cycles column of the module's
# test_data/<dir>/<top>/test_data.md. It is a list with one value per
# [[simulations.parameters]] block, in the same order, or a single integer
# when the entry has no parameter blocks. constant has no clock: each of its
# tests is one combinational check, counted as 1. The key is informational:
# tests/test_runner.py does not read it, and it is kept out of
# [[simulations.parameters]] because every key there is passed to the DUT as
# an HDL parameter.

# ── BasicModules ─────────────────────────────────────────────────────────────

# test constant
[[simulations]]
dir = "BasicModules"
top = "constant"
simulation_cycles = [1, 1, 1, 1, 1]
# zero output
[[simulations.parameters]]
NBITS = 8
VAL = 0
# alternating bits (0xAA)
[[simulations.parameters]]
NBITS = 8
VAL = 170
# maximum 8-bit value
[[simulations.parameters]]
NBITS = 8
VAL = 255
# 4-bit output
[[simulations.parameters]]
NBITS = 4
VAL = 7
# maximum 12-bit value
[[simulations.parameters]]
NBITS = 12
VAL = 4095

# test counter
[[simulations]]
dir = "BasicModules"
top = "counter"
simulation_cycles = [299, 299, 299, 299, 299, 300, 300, 300, 300, 300, 300, 300, 300, 300]
# free_running(0), up(0), step=1 — basic increment with wrap-around
[[simulations.parameters]]
NBITS = 8
STEP = 1
INIT_VAL = 0
COUNT_TO_VAL = 0
COUNTER_TYPE = 0
COUNT_DIR = 0
# free_running(0), up(0), step=3 — non-unit step with wrap-around
[[simulations.parameters]]
NBITS = 8
STEP = 3
INIT_VAL = 0
COUNT_TO_VAL = 0
COUNTER_TYPE = 0
COUNT_DIR = 0
# free_running(0), down(1), step=1 — decrement with wrap-around
[[simulations.parameters]]
NBITS = 8
STEP = 1
INIT_VAL = 255
COUNT_TO_VAL = 0
COUNTER_TYPE = 0
COUNT_DIR = 1
# count_limit(1), up(0) — count to 20 then hold
[[simulations.parameters]]
NBITS = 8
STEP = 1
INIT_VAL = 0
COUNT_TO_VAL = 20
COUNTER_TYPE = 1
COUNT_DIR = 0
# count_limit(1), down(1) — count down to 0 then hold
[[simulations.parameters]]
NBITS = 8
STEP = 1
INIT_VAL = 20
COUNT_TO_VAL = 0
COUNTER_TYPE = 1
COUNT_DIR = 1
# count_limit(1), up(0), INIT_VAL=RST_VAL=9, to 17 — Xilinx start_count on power-on/reset/wrap
[[simulations.parameters]]
COUNTER_TYPE = 1
NBITS = 6
COUNT_TO_VAL = 17
COUNT_DIR = 0
INIT_VAL = 9
STEP = 1
ENABLE_SYNC_RST = 1
ENABLE_ENABLE = 1
RST_VAL = 9
# free_running(0), up(0), RST_VAL=15 — reset to a nonzero value, power-on 0
[[simulations.parameters]]
COUNTER_TYPE = 0
NBITS = 4
COUNT_TO_VAL = 0
COUNT_DIR = 0
INIT_VAL = 0
STEP = 1
ENABLE_SYNC_RST = 1
ENABLE_ENABLE = 1
RST_VAL = 15
# free_running(0), down(1), RST_VAL=5, no enable port — reset only
[[simulations.parameters]]
COUNTER_TYPE = 0
NBITS = 4
COUNT_TO_VAL = 0
COUNT_DIR = 1
INIT_VAL = 12
STEP = 1
ENABLE_SYNC_RST = 1
ENABLE_ENABLE = 0
RST_VAL = 5
# count_limit(1), down(1), INIT_VAL=20, RST_VAL=3, to 0 — reset value differs from wrap value
[[simulations.parameters]]
COUNTER_TYPE = 1
NBITS = 5
COUNT_TO_VAL = 0
COUNT_DIR = 1
INIT_VAL = 20
STEP = 1
ENABLE_SYNC_RST = 1
ENABLE_ENABLE = 1
RST_VAL = 3
# free_running(0), up(0), step=3, RST_VAL=0 (default) — clear-to-zero reset with enable
[[simulations.parameters]]
COUNTER_TYPE = 0
NBITS = 8
COUNT_TO_VAL = 0
COUNT_DIR = 0
INIT_VAL = 0
STEP = 3
ENABLE_SYNC_RST = 1
ENABLE_ENABLE = 1
RST_VAL = 0
# free_running(0), up_down(2), up port toggling, rst + enable
[[simulations.parameters]]
COUNTER_TYPE = 0
NBITS = 4
COUNT_TO_VAL = 0
COUNT_DIR = 2
INIT_VAL = 6
STEP = 1
ENABLE_SYNC_RST = 1
ENABLE_ENABLE = 1
ENABLE_LOAD = 0
# count_limit(1), up_down(2), INIT_VAL=3 to 13, step=2 — limit compare in both directions
[[simulations.parameters]]
COUNTER_TYPE = 1
NBITS = 5
COUNT_TO_VAL = 13
COUNT_DIR = 2
INIT_VAL = 3
STEP = 2
ENABLE_SYNC_RST = 1
ENABLE_ENABLE = 1
ENABLE_LOAD = 0
# free_running(0), up(0), load port, rst + enable — load gated by enable
[[simulations.parameters]]
COUNTER_TYPE = 0
NBITS = 6
COUNT_TO_VAL = 0
COUNT_DIR = 0
INIT_VAL = 0
STEP = 1
ENABLE_SYNC_RST = 1
ENABLE_ENABLE = 1
ENABLE_LOAD = 1
# count_limit(1), down(1), INIT_VAL=10 to 0, load port, rst, no enable — wrap beats load
[[simulations.parameters]]
COUNTER_TYPE = 1
NBITS = 5
COUNT_TO_VAL = 0
COUNT_DIR = 1
INIT_VAL = 10
STEP = 1
ENABLE_SYNC_RST = 1
ENABLE_ENABLE = 0
ENABLE_LOAD = 1

